<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>세미나실 예약 시스템</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background-color: #2b6cb0; color: white; border: none; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>🏫 세미나실 예약하기</h2>
  <form id="bookingForm">
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="userName" required placeholder="홍길동">
    </div>

    <div class="form-group">
      <label>학번</label>
      <input type="text" id="studentId" required placeholder="20261234">
    </div>

    <div class="form-group">
      <label>세미나실 선택</label>
      <select id="roomSelect" required>
        <!-- 1~10번 세미나실 -->
        <option value="">세미나실을 선택하세요</option>
        <script>
          for(let i=1; i<=10; i++){
            document.write(`<option value="세미나실 ${i}">세미나실 ${i}</option>`);
          }
        </script>
      </select>
    </div>

    <div class="form-group">
      <label>예약 날짜 (월~금만 가능)</label>
      <input type="date" id="bookingDate" required>
    </div>

    <div class="form-group">
      <label>시작 시간 (08:00 ~ 21:00)</label>
      <input type="time" id="startTime" min="08:00" max="21:00" required>
    </div>

    <div class="form-group">
      <label>종료 시간 (09:00 ~ 22:00)</label>
      <input type="time" id="endTime" min="09:00" max="22:00" required>
    </div>

    <button type="submit">예약 신청</button>
  </form>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const dateVal = new Date(document.getElementById('bookingDate').value);
      const day = dateVal.getDay(); // 0: 일, 6: 토
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;

      // 1. 주말 체크 (0: 일, 6: 토)
      if (day === 0 || day === 6) {
        alert('월요일부터 금요일까지만 예약 가능합니다.');
        return;
      }

      // 2. 시간 계산 (HH:MM)
      const [sHours, sMinutes] = start.split(':').map(Number);
      const [eHours, eMinutes] = end.split(':').map(Number);

      const startMinutes = sHours * 60 + sMinutes;
      const endMinutes = eHours * 60 + eMinutes;

      // 3. 운영시간 체크 (08:00 = 480분, 22:00 = 1320분)
      if (startMinutes < 480 || endMinutes > 1320 || startMinutes >= endMinutes) {
        alert('운영 시간은 오전 08:00부터 오후 22:00까지입니다.');
        return;
      }

      // 4. 최대 3시간 제한 체크 (180분)
      const duration = endMinutes - startMinutes;
      if (duration > 180) {
        alert('최대 예약 가능 시간은 3시간입니다.');
        return;
      }

      alert('조건 검증 완료! 데이터 제출을 진행합니다.');
      // 데이터베이스(Google Forms / Sheets API 등)로 전달하는 코드 추가
    });
  </script>
</body>
</html>
